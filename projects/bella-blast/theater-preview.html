<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bella Blast</title>
<meta name="description" content="A guided game that ends with the right thing for you. No pages. No menu. One path.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --onyx: #0B0B0C;
  --soft-black: #15151A;
  --soft-black-2: #1a0f12;
  --rose: #B76E79;
  --rose-light: #D7A1A0;
  --rose-glow: rgba(183,110,121,0.35);
  --champagne: #E7C9BE;
  --ivory: #F5F0EC;
  --smoke: #8A8A92;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--onyx);
  color: var(--ivory);
  font-family: 'Inter', system-ui, sans-serif;
  font-weight: 300;
  overflow: hidden;
  height: 100vh;
  width: 100vw;
  -webkit-font-smoothing: antialiased;
}

body::before {
  content: "";
  position: fixed; inset: 0;
  background-image: radial-gradient(circle at 1px 1px, rgba(231,201,190,0.015) 1px, transparent 0);
  background-size: 3px 3px;
  pointer-events: none;
  z-index: 2;
  mix-blend-mode: overlay;
}

.vignette {
  position: fixed; inset: 0;
  background: radial-gradient(ellipse at center, transparent 35%, rgba(183,110,121,0.07) 100%);
  pointer-events: none;
  z-index: 1;
}

.hairline {
  position: fixed; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--rose) 50%, transparent);
  opacity: 0.3; z-index: 5;
}
.hairline.top    { top: 24px; }
.hairline.bottom { bottom: 24px; }

/* progress dots - super subtle */
.progress {
  position: fixed;
  top: 32px; left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 10px;
  z-index: 10;
  opacity: 0;
  transition: opacity 600ms ease;
}
.progress.show { opacity: 0.7; }
.progress .dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: rgba(231,201,190,0.2);
  transition: all 400ms ease;
}
.progress .dot.done { background: var(--rose); }
.progress .dot.current {
  background: var(--rose-light);
  box-shadow: 0 0 10px var(--rose-glow);
}

/* every card is a full viewport */
.card {
  position: fixed; inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 5rem 1.5rem 4rem;
  opacity: 0;
  pointer-events: none;
  transform: translateY(20px);
  transition: opacity 700ms ease, transform 700ms ease;
  z-index: 3;
  text-align: center;
}
.card.active {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0);
}

/* --- OPENING --- */
.open-name {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-size: clamp(2rem, 7vw, 4rem);
  letter-spacing: 0.4em;
  color: var(--ivory);
  margin-bottom: 1.5rem;
}
.open-line {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-weight: 300;
  font-size: clamp(1rem, 2.3vw, 1.3rem);
  color: var(--champagne);
  margin-bottom: 3.5rem;
  max-width: 500px;
  line-height: 1.6;
}
.begin {
  background: none;
  border: 1px solid var(--rose);
  color: var(--ivory);
  font-family: 'Inter', sans-serif;
  font-weight: 400;
  font-size: 0.75rem;
  letter-spacing: 0.4em;
  padding: 1rem 2.5rem;
  cursor: pointer;
  transition: all 600ms ease;
  text-transform: uppercase;
}
.begin:hover, .begin:focus-visible {
  background: linear-gradient(135deg, var(--rose), var(--champagne), var(--rose));
  color: var(--onyx);
  letter-spacing: 0.5em;
  outline: none;
}

/* --- QUESTIONS --- */
.q-prompt {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-weight: 300;
  font-size: clamp(1.4rem, 3.5vw, 2.1rem);
  color: var(--ivory);
  margin-bottom: 3rem;
  max-width: 640px;
  line-height: 1.4;
}

.options {
  display: grid;
  grid-template-columns: repeat(2, minmax(140px, 220px));
  gap: 1rem;
  max-width: 500px;
  width: 100%;
}
.options.three { grid-template-columns: repeat(auto-fit, minmax(140px, 220px)); max-width: 720px; }
@media (max-width: 500px) {
  .options { grid-template-columns: 1fr; max-width: 320px; }
}

.option {
  background: var(--soft-black);
  border: 1px solid rgba(231,201,190,0.15);
  color: var(--ivory);
  font-family: 'Cormorant Garamond', serif;
  font-weight: 400;
  font-size: clamp(1rem, 1.8vw, 1.2rem);
  letter-spacing: 0.05em;
  padding: 1.4rem 1rem;
  cursor: pointer;
  transition: all 450ms ease;
  position: relative;
  overflow: hidden;
}
.option::before {
  content: "";
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at 50% 150%, var(--rose-glow), transparent 70%);
  opacity: 0;
  transition: opacity 500ms ease;
}
.option:hover, .option:focus-visible {
  border-color: var(--rose);
  color: var(--rose-light);
  outline: none;
}
.option:hover::before, .option:focus-visible::before { opacity: 1; }
.option span { position: relative; z-index: 1; }

/* --- REVEAL --- */
.reveal {
  display: flex;
  flex-direction: column;
  align-items: center;
  max-width: 680px;
}
.reveal-eyebrow {
  font-family: 'Inter', sans-serif;
  font-size: 0.7rem;
  letter-spacing: 0.4em;
  color: var(--rose);
  margin-bottom: 1rem;
  text-transform: uppercase;
}
.reveal-title {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-size: clamp(2.2rem, 5.5vw, 3.4rem);
  letter-spacing: 0.08em;
  line-height: 1.1;
  margin-bottom: 2rem;
  color: var(--ivory);
}
.reveal-body {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: clamp(1.05rem, 2vw, 1.25rem);
  font-weight: 300;
  line-height: 1.75;
  color: var(--champagne);
  margin-bottom: 2.75rem;
  max-width: 540px;
}
.reveal-cta {
  padding: 1rem 2.5rem;
  border: 1px solid var(--rose);
  background: transparent;
  color: var(--ivory);
  font-family: 'Inter', sans-serif;
  font-weight: 400;
  font-size: 0.75rem;
  letter-spacing: 0.35em;
  cursor: pointer;
  transition: all 500ms ease;
  text-transform: uppercase;
  text-decoration: none;
  display: inline-block;
}
.reveal-cta:hover, .reveal-cta:focus-visible {
  background: linear-gradient(135deg, var(--rose), var(--champagne), var(--rose));
  color: var(--onyx);
  letter-spacing: 0.45em;
  outline: none;
}

.reveal-second {
  margin-top: 1.5rem;
  background: none;
  border: none;
  color: var(--smoke);
  font-family: 'Inter', sans-serif;
  font-size: 0.65rem;
  letter-spacing: 0.3em;
  cursor: pointer;
  padding: 0.5rem;
  text-transform: uppercase;
  transition: color 400ms ease;
}
.reveal-second:hover { color: var(--rose-light); }

/* breathing frame around reveal */
.reveal-frame {
  position: relative;
  padding: 2.5rem 2rem;
  margin-bottom: 2rem;
}
.reveal-frame::before, .reveal-frame::after {
  content: "";
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  width: 60px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--rose), transparent);
}
.reveal-frame::before { top: 0; }
.reveal-frame::after  { bottom: 0; }

/* back button on question cards */
.back-step {
  position: fixed;
  top: 32px; left: 24px;
  background: none;
  border: none;
  color: var(--smoke);
  font-family: 'Inter', sans-serif;
  font-size: 0.65rem;
  letter-spacing: 0.25em;
  cursor: pointer;
  padding: 0.5rem;
  z-index: 10;
  text-transform: uppercase;
  opacity: 0;
  pointer-events: none;
  transition: opacity 400ms ease, color 400ms ease;
}
.back-step.show {
  opacity: 1;
  pointer-events: auto;
}
.back-step:hover { color: var(--rose-light); }

.whisper {
  position: fixed;
  bottom: 32px; left: 50%;
  transform: translateX(-50%);
  font-size: 0.58rem;
  letter-spacing: 0.3em;
  color: var(--smoke);
  z-index: 5;
  text-transform: uppercase;
}

@media (max-width: 500px) {
  .card { padding: 4.5rem 1.25rem 3.5rem; }
  .back-step { top: 20px; left: 16px; }
  .whisper { bottom: 22px; font-size: 0.5rem; }
  .progress { top: 22px; }
  .reveal-frame { padding: 1.75rem 1rem; }
}
</style>
</head>
<body>

<div class="vignette"></div>
<div class="hairline top"></div>
<div class="hairline bottom"></div>

<div class="progress" id="progress" aria-hidden="true">
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>
</div>

<button class="back-step" id="backStep">← Back</button>

<!-- OPENING -->
<section class="card active" id="open" aria-label="Opening">
  <h1 class="open-name">B E L L A &nbsp; B L A S T</h1>
  <p class="open-line">I'll figure you out faster than you can lie to yourself.<br>Three questions. One answer.</p>
  <button class="begin" data-step="q1">Begin</button>
</section>

<!-- Q1 — niche -->
<section class="card" id="q1" aria-label="Question 1">
  <p class="q-prompt">What pulled you here first?</p>
  <div class="options">
    <button class="option" data-answer="niche:body"><span>My body</span></button>
    <button class="option" data-answer="niche:feet"><span>My feet</span></button>
    <button class="option" data-answer="niche:gas"><span>My gas</span></button>
    <button class="option" data-answer="niche:dark"><span>Something darker</span></button>
  </div>
</section>

<!-- Q2 — format -->
<section class="card" id="q2" aria-label="Question 2">
  <p class="q-prompt">How do you want it?</p>
  <div class="options three">
    <button class="option" data-answer="format:custom"><span>Made for me</span></button>
    <button class="option" data-answer="format:ongoing"><span>Rotating drops</span></button>
    <button class="option" data-answer="format:physical"><span>Something I can hold</span></button>
  </div>
</section>

<!-- Q3 — intensity -->
<section class="card" id="q3" aria-label="Question 3">
  <p class="q-prompt">And how deep do you want to go?</p>
  <div class="options three">
    <button class="option" data-answer="intensity:easy"><span>Easy on me</span></button>
    <button class="option" data-answer="intensity:medium"><span>I can take more</span></button>
    <button class="option" data-answer="intensity:deep"><span>Make me beg</span></button>
  </div>
</section>

<!-- REVEAL -->
<section class="card" id="reveal" aria-label="Your match">
  <div class="reveal">
    <div class="reveal-frame">
      <div class="reveal-eyebrow" id="revealEyebrow">THE MATCH</div>
      <h2 class="reveal-title" id="revealTitle">—</h2>
      <p class="reveal-body" id="revealBody">—</p>
    </div>
    <a class="reveal-cta" id="revealCta" href="#">Request this</a>
    <button class="reveal-second" id="restart">Start over</button>
  </div>
</section>

<div class="whisper" id="whisper">18+ · Consent only · Replies within 24 hours</div>

<script>
  const state = { niche: null, format: null, intensity: null };
  const steps = ['open','q1','q2','q3','reveal'];
  let stepIdx = 0;

  const progress = document.getElementById('progress');
  const dots = progress.querySelectorAll('.dot');
  const backBtn = document.getElementById('backStep');

  function showCard(id) {
    document.querySelectorAll('.card').forEach(c => c.classList.toggle('active', c.id === id));
    stepIdx = steps.indexOf(id);
    // progress visible on q1-q3 only
    const onQuestion = ['q1','q2','q3'].includes(id);
    progress.classList.toggle('show', onQuestion);
    dots.forEach((d, i) => {
      d.classList.remove('done','current');
      if (onQuestion) {
        const qIdx = ['q1','q2','q3'].indexOf(id);
        if (i < qIdx) d.classList.add('done');
        if (i === qIdx) d.classList.add('current');
      }
    });
    backBtn.classList.toggle('show', onQuestion);
    if (id === 'reveal') renderReveal();
  }

  document.querySelectorAll('[data-step]').forEach(el => {
    el.addEventListener('click', () => showCard(el.dataset.step));
  });

  document.querySelectorAll('[data-answer]').forEach(el => {
    el.addEventListener('click', () => {
      const [key, val] = el.dataset.answer.split(':');
      state[key] = val;
      if (key === 'niche') showCard('q2');
      else if (key === 'format') showCard('q3');
      else if (key === 'intensity') showCard('reveal');
    });
  });

  backBtn.addEventListener('click', () => {
    const cur = steps[stepIdx];
    if (cur === 'q1') showCard('open');
    else if (cur === 'q2') { state.niche = null; showCard('q1'); }
    else if (cur === 'q3') { state.format = null; showCard('q2'); }
  });

  document.getElementById('restart').addEventListener('click', () => {
    state.niche = state.format = state.intensity = null;
    showCard('open');
  });

  // ---- MATCH LOGIC ----
  // The Bella Effect takes the center. Most "custom" paths lead there.
  function match() {
    const { niche, format, intensity } = state;

    if (format === 'custom') {
      // Bella Effect takes everything custom
      return {
        eyebrow: 'THE SIGNATURE',
        title: 'The Bella Effect',
        body: nicheLineCustom(niche, intensity),
        cta: 'Request yours',
      };
    }

    if (format === 'ongoing') {
      // Route to the matching vault or ongoing channel
      const nicheMap = {
        body: {
          title: 'All My Curves',
          body: 'My private body vault. Mostly teasing, rotating clips and pics that never hit my public pages. For the ones who are here for the body first.',
          cta: 'Enter the vault',
          eyebrow: 'MEMBERS ONLY',
        },
        feet: {
          title: 'Rotating Feet',
          body: 'Feet on repeat live on AllThingsWorn and my OnlyFans. New drops week to week. Pick a lane and I\'ll meet you there.',
          cta: 'Follow the drops',
          eyebrow: 'ONGOING',
        },
        gas: {
          title: 'VIFL',
          body: 'The private fart vault. BBW volume, real frequency, up close. At least eight scenes streaming at any time. If one hits, grab it before it leaves.',
          cta: 'Enter the vault',
          eyebrow: 'MEMBERS ONLY',
        },
        dark: {
          title: 'VISL',
          body: 'The private scat vault. Up close, mostly from behind, rotating. Ten behind-the-toilet scenes streaming at any time. Content that never touches my public pages.',
          cta: 'Enter the vault',
          eyebrow: 'MEMBERS ONLY',
        },
      };
      return nicheMap[niche];
    }

    if (format === 'physical') {
      return {
        eyebrow: 'OFF MY BODY',
        title: 'Worn & Used',
        body: physicalLine(niche, intensity),
        cta: 'Build yours',
      };
    }
  }

  function nicheLineCustom(niche, intensity) {
    const nicheWord = {
      body: 'the body',
      feet: 'the feet',
      gas: 'the gas',
      dark: 'the darker places',
    }[niche];

    const closer = {
      easy: 'I will take it easy with you. We build it together.',
      medium: 'I give you what you asked for, then a little past it.',
      deep: 'You asked for it. I will not stop until you break.',
    }[intensity];

    return `A session built around you, aimed at ${nicheWord}. You tell me the scene in your head. I come back with scope and a quote. We refine it in DM until it fits. You get a file nobody else sees. ${closer}`;
  }

  function physicalLine(niche, intensity) {
    const item = {
      body: 'worn panties, face masks, or a mystery set from my stash',
      feet: 'worn socks, insoles, foot dust, or shoes if I have a pair worth sending',
      gas: 'a scent inhaler or a face mask that sat where it mattered',
      dark: 'the darker items I only ship to people who ask correctly',
    }[niche];

    const wear = {
      easy: 'Short wear, fresh for you.',
      medium: 'Standard wear. The longer it rides, the more there is.',
      deep: 'Long haul wear. Days on my body, daily photos the whole time, cheaper per day past day ten.',
    }[intensity];

    return `${wear} ${item.charAt(0).toUpperCase() + item.slice(1)}. Sealed the second it comes off, vacuum packed, discreet, tracked. Every order is filmed being made.`;
  }

  function renderReveal() {
    const m = match();
    if (!m) return;
    document.getElementById('revealEyebrow').textContent = m.eyebrow;
    document.getElementById('revealTitle').textContent = m.title;
    document.getElementById('revealBody').textContent = m.body;
    document.getElementById('revealCta').textContent = m.cta;
  }

  // Escape returns to opening
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      state.niche = state.format = state.intensity = null;
      showCard('open');
    }
  });
</script>

</body>
</html>
