  return {categories:SEED.categories.slice(),prompts:SEED.prompts.map(p=>({...p})),favs:[]};
}
function save(){try{localStorage.setItem(CKEY,JSON.stringify(store));}catch(e){}}

const state={cat:'all',q:'',favOnly:false,showAdult:false};
const $=s=>document.querySelector(s);

function catColor(name){const c=store.categories.find(c=>c.name===name);return c?c.color:'purple';}
function visiblePrompts(){
  return store.prompts.filter(p=>{
    if(!state.showAdult && p.is_adult) return false;
    if(state.favOnly && !store.favs.includes(p.id)) return false;
    if(state.cat!=='all' && p.category!==state.cat) return false;
    if(state.q){const q=state.q.toLowerCase();
      const hay=(p.title+' '+p.text+' '+p.category+' '+(p.tags||[]).join(' ')+' '+(p.notes||'')).toLowerCase();
      if(!hay.includes(q)) return false;}
    return true;
  });
}
function renderChips(){
  const wrap=$('#chips');wrap.innerHTML='';
  const pool=store.prompts.filter(p=>state.showAdult||!p.is_adult);
  const all=document.createElement('button');
  all.className='chip';all.setAttribute('aria-pressed',state.cat==='all');
  all.innerHTML=`All <span class="n">${pool.length}</span>`;
  all.onclick=()=>{state.cat='all';render();};wrap.appendChild(all);
  store.categories.forEach(c=>{
    const n=pool.filter(p=>p.category===c.name).length;
    const b=document.createElement('button');
    b.className='chip';b.setAttribute('aria-pressed',state.cat===c.name);
    b.style.color=state.cat===c.name?'':cvar(c.color);
    b.innerHTML=`<span class="swatch" style="color:${cvar(c.color)}"></span>${c.name} <span class="n">${n}</span>`;
    b.onclick=()=>{state.cat=c.name;render();};
    wrap.appendChild(b);
  });
}
function card(p){
  const el=document.createElement('article');el.className='card';el.style.setProperty('--cc',cvar(p.color));
  const faved=store.favs.includes(p.id);
  const snippet=p.needs_full_text?'Full prompt stored on the source card. Open to view.':p.text;
  el.innerHTML=`
    <div class="cat"><span>${p.category}</span>${p.is_adult?'<span class="adult">18+</span>':''}</div>
    <h3></h3>
    <p></p>
    <div class="tags"></div>
    <div class="foot">
      <button class="copy">⧉ Copy</button>
      <button class="fav ${faved?'on':''}" title="Save">♥</button>
      <div class="admin-actions">
        <button class="mini edit" title="Edit">✎</button>
        <button class="mini del" title="Delete">🗑</button>
      </div>
    </div>`;
  el.querySelector('h3').textContent=p.title;
  el.querySelector('p').textContent=snippet;
  const tg=el.querySelector('.tags');(p.tags||[]).slice(0,4).forEach(t=>{const s=document.createElement('span');s.className='tag';s.textContent=t;tg.appendChild(s);});
  el.querySelector('h3').onclick=()=>openDetail(p);
  el.querySelector('p').onclick=()=>openDetail(p);
  el.querySelector('.copy').onclick=e=>{e.stopPropagation();doCopy(p,e.currentTarget);};
  el.querySelector('.fav').onclick=e=>{e.stopPropagation();toggleFav(p.id);};
  el.querySelector('.edit').onclick=e=>{e.stopPropagation();openForm(p);};
  el.querySelector('.del').onclick=e=>{e.stopPropagation();openConfirm(p);};
  return el;
}
function render(){
  renderChips();
  const list=visiblePrompts();
  const grid=$('#grid');grid.innerHTML='';
  list.forEach(p=>grid.appendChild(card(p)));
  $('#empty').hidden=list.length>0;
  $('#count').textContent=`${list.length} prompt${list.length===1?'':'s'}${state.favOnly?' saved':''}${state.cat!=='all'?' in '+state.cat:''}`;
}
function doCopy(p,btn){
  const text=p.needs_full_text?(p.text+'\n\n[Full prompt on source card: '+p.source_url+']'):p.text;
  const done=()=>{btn.classList.add('done');btn.textContent='✓ Copied';setTimeout(()=>{btn.classList.remove('done');btn.innerHTML='⧉ Copy';},1400);};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
  }else fallbackCopy(text,done);
}
function fallbackCopy(text,cb){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');cb();}catch(e){}document.body.removeChild(ta);}
function toggleFav(id){const i=store.favs.indexOf(id);if(i>=0)store.favs.splice(i,1);else store.favs.push(id);save();render();}

/* detail sheet */
function openDetail(p){
  const full=p.needs_full_text?'This card points to its full prompt on the source page:\n'+p.source_url:p.text;
  modal(`
    <div class="cat" style="--cc:${cvar(p.color)}">${p.category}${p.is_adult?' · 18+':''}</div>
    <h2></h2>
    <div class="pre" id="pre"></div>
    ${p.context?`<p class="meta"><b>Inputs:</b> <span id="ctx"></span></p>`:''}
    ${p.notes?`<p class="meta"><b>Notes:</b> <span id="nts"></span></p>`:''}
    <div class="foot">
      <button class="copy" id="dcopy" style="--cc:${cvar(p.color)}">⧉ Copy prompt</button>
      <button class="fav ${store.favs.includes(p.id)?'on':''}" id="dfav">♥</button>
    </div>`,root=>{
    root.querySelector('h2').textContent=p.title;
    root.querySelector('#pre').textContent=full;
    if(p.context)root.querySelector('#ctx').textContent=p.context;
    if(p.notes)root.querySelector('#nts').textContent=p.notes;
    root.querySelector('#dcopy').onclick=e=>doCopy(p,e.currentTarget);
    root.querySelector('#dfav').onclick=e=>{toggleFav(p.id);e.currentTarget.classList.toggle('on');};
  });
}
/* add / edit form */
function openForm(p){
  const isEdit=!!p;
  const opts=store.categories.map(c=>`<option value="${c.name}" ${p&&p.category===c.name?'selected':''}>${c.name}</option>`).join('');
  modal(`
    <h2>${isEdit?'Edit prompt':'New prompt'}</h2>
    <div class="field"><label>Title</label><input id="f_title" value="${p?esc(p.title):''}"></div>
    <div class="field"><label>Category</label><select id="f_cat">${opts}<option value="__new__">+ New category...</option></select></div>
    <div class="field" id="newcatWrap" hidden>
      <div class="row2">
        <input id="f_newcat" placeholder="New category name">
        <select id="f_newcolor">${Object.keys(COLORS).map(c=>`<option value="${c}">${c}</option>`).join('')}</select>
      </div>
    </div>
    <div class="field"><label>Prompt text</label><textarea id="f_text">${p?esc(p.text):''}</textarea></div>
    <div class="field"><label>Tags (comma separated)</label><input id="f_tags" value="${p?esc((p.tags||[]).join(', ')):''}"></div>
    <div class="field"><label class="chk"><input type="checkbox" id="f_adult" ${p&&p.is_adult?'checked':''}> Mark as 18+ (routes to adult store)</label></div>
    <div class="foot">
      <button class="btn ghost" id="f_cancel">Cancel</button>
      <button class="btn" id="f_save">${isEdit?'Save':'Add prompt'}</button>
    </div>`,root=>{
    const sel=root.querySelector('#f_cat'),nw=root.querySelector('#newcatWrap');
    sel.onchange=()=>{nw.hidden=sel.value!=='__new__';};
    root.querySelector('#f_cancel').onclick=closeModal;
    root.querySelector('#f_save').onclick=()=>{
      const title=root.querySelector('#f_title').value.trim();
      const text=root.querySelector('#f_text').value.trim();
      if(!title||!text){root.querySelector('#f_title').style.borderColor=title?'':'var(--pink)';root.querySelector('#f_text').style.borderColor=text?'':'var(--pink)';return;}
      let cat=sel.value;
      if(cat==='__new__'){cat=root.querySelector('#f_newcat').value.trim()||'Other';
        const color=root.querySelector('#f_newcolor').value;
        if(!store.categories.find(c=>c.name===cat))store.categories.push({name:cat,color});}
      const color=catColor(cat);
      const tags=root.querySelector('#f_tags').value.split(',').map(t=>t.trim()).filter(Boolean);
      const adult=root.querySelector('#f_adult').checked;
      if(isEdit){Object.assign(p,{title,text,category:cat,color,tags,is_adult:adult,needs_full_text:false});}
      else{const id=Math.max(0,...store.prompts.map(x=>x.id))+1;
        store.prompts.unshift({id,title,text,category:cat,color,tags,is_adult:adult,status:'Approved',context:'',notes:'',needs_full_text:false,source_url:''});}
      save();closeModal();render();
    };
  });
}
function openConfirm(p){
  modal(`<h2>Delete this prompt?</h2>
    <p class="meta">"<b>${esc(p.title)}</b>" will be removed. This cannot be undone.</p>
    <div class="foot"><button class="btn ghost" id="c_no">Keep it</button><button class="btn danger" id="c_yes">Delete</button></div>`,
    root=>{root.querySelector('#c_no').onclick=closeModal;
      root.querySelector('#c_yes').onclick=()=>{store.prompts=store.prompts.filter(x=>x.id!==p.id);store.favs=store.favs.filter(f=>f!==p.id);save();closeModal();render();};});
}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

/* modal plumbing */
function modal(html,after){
  const r=$('#modalRoot');
  r.innerHTML=`<div class="scrim"><div class="sheet"><button class="close" aria-label="Close">×</button>${html}</div></div>`;
  const scrim=r.querySelector('.scrim');
  scrim.onclick=e=>{if(e.target===scrim)closeModal();};
  r.querySelector('.close').onclick=closeModal;
  if(after)after(r.querySelector('.sheet'));
}
function closeModal(){$('#modalRoot').innerHTML='';}

/* header controls */
$('#favBtn').onclick=e=>{state.favOnly=!state.favOnly;e.currentTarget.setAttribute('aria-pressed',state.favOnly);e.currentTarget.classList.toggle('on',state.favOnly);render();};
$('#adultBtn').onclick=e=>{state.showAdult=!state.showAdult;e.currentTarget.setAttribute('aria-pressed',state.showAdult);e.currentTarget.classList.toggle('on',state.showAdult);render();};
$('#adminBtn').onclick=e=>{const on=!document.body.classList.contains('admin');document.body.classList.toggle('admin',on);e.currentTarget.setAttribute('aria-pressed',on);e.currentTarget.classList.toggle('on',on);};
$('#q').oninput=e=>{state.q=e.target.value;$('#clr').style.display=state.q?'block':'none';render();};
$('#clr').onclick=()=>{state.q='';$('#q').value='';$('#clr').style.display='none';render();};
$('#fab').onclick=()=>openForm(null);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

render();
</script>
